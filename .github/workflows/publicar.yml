# Publica a app na Cloudflare Pages (e prepara a D1 e a KV da primeira vez).
name: Publicar
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['app/web/**', 'functions/**', 'cloud/worker-core.js', 'cloud/instalar.py', '.github/workflows/publicar.yml']
concurrency: { group: publicar }
jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Limpar os segredos (espaços ou linhas a mais ao colar)
        env:
          T: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          A: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          t=$(printf '%s' "$T" | tr -d '[:space:]')
          # o LibreOffice/Word podem colar hífenes invisíveis ou "…": fica só com letras e números
          clean=$(printf '%s' "$A" | LC_ALL=C tr -cd '0-9A-Za-z')
          a=$(printf '%s' "$clean" | grep -oiE '[0-9a-f]{32}' | head -1 | tr 'A-F' 'a-f')
          test -n "$t" || { echo "O segredo CLOUDFLARE_API_TOKEN está vazio"; exit 1; }
          if [ -z "$a" ]; then
            echo "O segredo CLOUDFLARE_ACCOUNT_ID não tem um Account ID completo: recebi ${#clean} letras e números (devem ser 32, de 0-9 e a-f)."
            exit 1
          fi
          echo "::add-mask::$t"; echo "::add-mask::$a"
          echo "CLOUDFLARE_API_TOKEN=$t" >> "$GITHUB_ENV"
          echo "CLOUDFLARE_ACCOUNT_ID=$a" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Base de dados e KV
        run: python3 cloud/instalar.py
      - name: Projeto Pages (só cria da primeira vez)
        run: npx --yes wrangler@4 pages project create bigodds --production-branch main || true
      - name: Contas da app (Nome:palavra-passe, separadas por ;)
        env:
          APP_USERS: ${{ secrets.BIGODDS_UTILIZADORES }}
        run: |
          test -n "$APP_USERS" || { echo "Falta o segredo BIGODDS_UTILIZADORES no GitHub"; exit 1; }
          printf '%s' "$APP_USERS" | npx --yes wrangler@4 pages secret put APP_USERS --project-name bigodds
      - name: Publicar
        run: npx --yes wrangler@4 pages deploy --project-name bigodds --branch main --commit-dirty=true
