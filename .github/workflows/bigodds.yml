# Corre o Bigodds: análise completa de 30 em 30 min; placar, avisos e onzes de 5 em 5 min à hora dos jogos (UTC).
# Cada execução marca a seguinte (cloud/proxima.py): o horário automático do GitHub não estava a disparar.
# O horário de hora a hora fica só de reserva, para reiniciar a cadeia se ela parar (a execução mais recente é que continua).
name: Bigodds
on:
  schedule:
    - cron: '7 * * * *'
    - cron: '17 4 1 * *'
  workflow_dispatch:
    inputs:
      modo:
        description: 'completo ou aovivo'
        default: 'completo'
permissions:
  contents: write
  actions: write
concurrency: { group: bigodds-sync, cancel-in-progress: false }
jobs:
  correr:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Limpar os segredos (espaços ou linhas a mais ao colar)
        env:
          T: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          A: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          t=$(printf '%s' "$T" | tr -d '[:space:]')
          # o LibreOffice/Word podem colar hífenes invisíveis ou "…": fica só com letras e números
          clean=$(printf '%s' "$A" | LC_ALL=C tr -cd '0-9A-Za-z')
          a=$(printf '%s' "$clean" | grep -oiE '[0-9a-f]{32}' | head -1 | tr 'A-F' 'a-f')
          test -n "$t" || { echo "O segredo CLOUDFLARE_API_TOKEN está vazio"; exit 1; }
          if [ -z "$a" ]; then
            echo "O segredo CLOUDFLARE_ACCOUNT_ID não tem um Account ID completo: recebi ${#clean} letras e números (devem ser 32, de 0-9 e a-f)."
            exit 1
          fi
          echo "::add-mask::$t"; echo "::add-mask::$a"
          echo "CLOUDFLARE_API_TOKEN=$t" >> "$GITHUB_ENV"
          echo "CLOUDFLARE_ACCOUNT_ID=$a" >> "$GITHUB_ENV"
      - name: Correr
        env:
          SCHED: ${{ github.event.schedule }}
          MODO: ${{ inputs.modo }}
        run: |
          if [ "$SCHED" = "17 4 1 * *" ]; then
            # o GitHub desliga tarefas agendadas de repositórios sem atividade há 60 dias
            git config user.name "bigodds"; git config user.email "bigodds@users.noreply.github.com"
            git commit --allow-empty -m "Manter as tarefas agendadas ativas" && git push
            exit 0
          fi
          if [ -n "$MODO" ]; then m="$MODO"; else m=completo; fi
          python3 cloud/sync.py "$m"
      - name: Marcar a próxima execução
        if: ${{ !cancelled() && github.event.schedule != '17 4 1 * *' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 cloud/proxima.py
