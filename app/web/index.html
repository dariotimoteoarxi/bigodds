<!doctype html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#06120D">
<title>Bigodds</title>
<link rel="icon" href="icone.svg">
<link rel="apple-touch-icon" href="icone-192.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #06120D; --surface: #0D1F17; --raised: #132A20; --line: #1F3A2D; --line-soft: #172E23;
    --ink: #F3F1E8; --muted: #9AAFA3; --faint: #6E857A;
    --lime: #C6F432; --lime-soft: rgba(198, 244, 50, .12); --green: #2F8F5B;
    --amber: #F2B632; --red: #E86F5E; --blue: #9EC1FF;
    --serif: "Fraunces", Georgia, serif; --sans: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
    --r: 20px; --r-sm: 12px;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.5 var(--sans); -webkit-font-smoothing: antialiased; }
  body.open { overflow: hidden; }
  button, input { font: inherit; color: inherit; }
  button { cursor: pointer; }
  .wrap { max-width: 760px; margin: 0 auto; padding: 0 20px; }

  header { position: sticky; top: 0; z-index: 20; background: rgba(6, 18, 13, .86); backdrop-filter: blur(14px); border-bottom: 1px solid var(--line-soft); }
  header .wrap { display: flex; align-items: center; gap: 12px; height: 60px; }
  header .wrap { max-width: 1000px; }  /* 7 menus não cabem nos 760px do conteúdo */
  @media (max-width: 900px) { .brand img.word { display: none; } .tabs button { padding: 8px 7px; font-size: 14px; } }
  @media (max-width: 780px) { .tabs button { padding: 8px 5px; font-size: 13px; } }
  .brand { display: flex; align-items: center; gap: 10px; background: none; border: 0; padding: 0; }
  .brand img.mark { width: 30px; height: 30px; }
  .brand img.word { height: 22px; }
  .tabs { margin-left: auto; display: flex; gap: 2px; min-width: 0; overflow-x: auto; scrollbar-width: none; }
  .tabs button { background: none; border: 0; color: var(--muted); padding: 8px 11px; white-space: nowrap; flex: none; border-radius: 999px; font-weight: 500; }
  .tabs button[aria-current="page"] { background: var(--raised); color: var(--ink); }
  nav.bottom { display: none; }
  .gear { flex: none; display: grid; place-items: center; width: 38px; height: 38px; margin-left: 4px; border-radius: 50%; border: 1px solid var(--line); background: none; color: var(--muted); }
  .gear[aria-current="page"], .gear:hover { color: var(--lime); border-color: var(--lime); }
  @media (max-width: 640px) { .gear { margin-left: auto; } }

  .hero { padding: 34px 0 18px; }
  .eyebrow { color: var(--muted); font-size: 12px; letter-spacing: .08em; text-transform: uppercase; margin: 0 0 10px; }
  h1 { font: 600 34px/1.12 var(--serif); letter-spacing: -.01em; margin: 0; }
  h1 em { font-style: normal; color: var(--lime); }
  .lede { color: var(--muted); font-size: 16px; margin: 12px 0 0; max-width: 580px; }
  .daybar { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1px; background: var(--line-soft); border: 1px solid var(--line-soft); border-radius: var(--r-sm); overflow: hidden; margin: 22px 0 8px; }
  .daybar div { background: var(--surface); padding: 12px 14px; }
  .daybar b { display: block; font: 600 20px/1.2 var(--serif); }
  .daybar span { color: var(--muted); font-size: 12px; }

  .tip { background: linear-gradient(180deg, var(--surface), #0B1B14); border: 1px solid var(--line); border-radius: var(--r); padding: 20px; margin: 14px 0; }
  .tip.live { opacity: .55; }
  .when { display: flex; gap: 8px; align-items: center; color: var(--muted); font-size: 13px; }
  .when .dot { width: 4px; height: 4px; border-radius: 50%; background: var(--faint); }
  .tip .match { font: 600 22px/1.2 var(--serif); margin: 6px 0 14px; }
  .tip .core { display: grid; grid-template-columns: 1fr auto; gap: 16px; align-items: center; }
  .tip .bet small { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .06em; }
  .tip .bet b { display: block; font-size: 19px; font-weight: 700; margin-top: 2px; }
  .minodd { margin-top: 10px; display: inline-flex; align-items: baseline; gap: 6px; background: var(--lime-soft); color: var(--lime); border-radius: 999px; padding: 6px 12px; font-weight: 600; }
  .minodd { white-space: nowrap; }
  .minodd span { font-weight: 500; font-size: 13px; color: var(--muted); }
  .slip { background: var(--surface); border: 1px dashed rgba(198, 244, 50, .35); border-radius: var(--r); padding: 18px; margin: 12px 0; }
  .slip-h { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
  .slip-h b { font: 600 20px var(--serif); }
  .slip-h .big { font: 600 26px var(--serif); color: var(--lime); }
  .leg { display: grid; grid-template-columns: 1fr auto; gap: 2px 10px; padding: 10px 0; border-bottom: 1px solid var(--line-soft); font-size: 14px; }
  .leg:last-of-type { border-bottom: 0; }
  .leg small { color: var(--muted); grid-column: 1; }
  .leg .p { font-weight: 700; text-align: right; grid-row: 1 / 3; grid-column: 2; align-self: center; }
  .learn td.good { color: var(--lime); } .learn td.bad { color: var(--red); }
  .ring { width: 92px; height: 92px; position: relative; }
  .ring svg { transform: rotate(-90deg); }
  .ring .val { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; line-height: 1.05; }
  .ring .val b { font: 600 24px var(--serif); }
  .ring .val span { display: block; font-size: 10px; color: var(--muted); letter-spacing: .04em; }
  .why { margin: 16px 0 0; font-size: 15px; color: #DCE3DA; }
  .risk { margin: 10px 0 0; font-size: 13px; color: var(--muted); display: flex; gap: 8px; }
  .risk::before { content: "!"; flex: none; width: 18px; height: 18px; border-radius: 50%; background: rgba(242, 182, 50, .14); color: var(--amber); font-weight: 700; font-size: 12px; display: grid; place-items: center; margin-top: 1px; }
  .foot { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; margin-top: 16px; padding-top: 14px; border-top: 1px solid var(--line-soft); }
  .conf { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; color: var(--muted); white-space: nowrap; }
  .conf i { width: 7px; height: 7px; border-radius: 50%; background: var(--line); display: inline-block; }
  .conf.Alta i.on { background: var(--lime); } .conf.Média i.on { background: var(--amber); } .conf.Baixa i.on { background: var(--faint); }
  .btn { border: 0; border-radius: 999px; padding: 10px 16px; font-weight: 600; }
  .btn.primary { background: var(--lime); color: #0B1F17; }
  .btn.ghost { background: var(--raised); color: var(--ink); }
  .btn.small { padding: 6px 12px; font-size: 13px; }
  .btn:disabled { opacity: .4; cursor: default; }
  .grow { flex: 1; }
  .note { margin-top: 12px; padding: 10px 12px; border-radius: var(--r-sm); background: rgba(158, 193, 255, .07); border-left: 3px solid var(--blue); font-size: 14px; color: #DCE3DA; }
  .note b { color: var(--blue); font-weight: 600; }
  .empty { text-align: center; padding: 48px 12px; color: var(--muted); }
  .empty h3 { font: 600 22px var(--serif); color: var(--ink); margin: 0 0 6px; }

  .section-title { font: 600 24px var(--serif); margin: 30px 0 4px; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; padding: 12px 0; }
  .chips button { flex: none; background: none; border: 1px solid var(--line); color: var(--muted); border-radius: 999px; padding: 6px 14px; }
  .chips button[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
  .day { display: flex; align-items: baseline; gap: 10px; margin: 26px 0 4px; padding: 12px 16px; border-radius: 14px; border-left: 4px solid var(--lime);
    background: linear-gradient(90deg, rgba(198, 244, 50, .10), rgba(198, 244, 50, 0) 70%); color: var(--ink); font: 600 18px var(--serif); }
  .day.today { border-left-color: var(--red); background: linear-gradient(90deg, rgba(232, 111, 94, .14), rgba(232, 111, 94, 0) 70%); }
  .day .rel { font: 700 11px var(--tech); letter-spacing: .12em; text-transform: uppercase; color: var(--lime); }
  .day.today .rel { color: var(--red); }
  .day .n { margin-left: auto; font: 500 12px var(--tech); color: var(--muted); }
  .cal-head, .cal { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
  .cal-head span { text-align: center; font: 600 11px var(--tech); letter-spacing: .1em; color: var(--faint); padding: 14px 0 4px; }
  .cal button { aspect-ratio: 1 / 1.05; border-radius: 14px; border: 1px solid var(--line-soft); background: rgba(255, 255, 255, .02); color: var(--ink);
    display: grid; align-content: center; justify-items: center; gap: 2px; padding: 4px; font: 600 20px var(--tech); }
  .cal button small { font: 500 10px var(--tech); color: var(--muted); }
  .cal button .dots { display: flex; gap: 3px; height: 6px; } .cal button .dots i { width: 6px; height: 6px; border-radius: 50%; }
  .cal button:disabled { opacity: .3; }
  .cal button.today { border-color: rgba(232, 111, 94, .6); }
  .cal button[aria-pressed="true"] { background: var(--lime); color: var(--bg); border-color: var(--lime); }
  .cal button[aria-pressed="true"] small { color: var(--bg); }
  .cal-key { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12px; color: var(--muted); margin: 10px 0 0; }
  .cal-key span { display: inline-flex; gap: 6px; align-items: center; } .cal-key i { width: 8px; height: 8px; border-radius: 50%; }
  .row { display: grid; grid-template-columns: 52px 1fr auto; gap: 12px; align-items: center; width: 100%; text-align: left; background: none; border: 0; border-bottom: 1px solid var(--line-soft); padding: 14px 4px; }
  .row:hover { background: rgba(255, 255, 255, .02); }
  .row .t { font-weight: 600; font-variant-numeric: tabular-nums; }
  .row .t small { display: block; color: var(--faint); font-weight: 500; font-size: 11px; }
  .row .teams { font-weight: 600; }
  .row .teams small { display: block; color: var(--muted); font-weight: 400; font-size: 13px; }
  .row .side { display: grid; justify-items: end; gap: 6px; }
  .tag { font-size: 12px; font-weight: 600; border-radius: 999px; padding: 4px 10px; white-space: nowrap; }
  .tag.aconselhada { background: var(--lime-soft); color: var(--lime); }
  .meter { width: 64px; height: 5px; border-radius: 3px; background: var(--line-soft); overflow: hidden; }
  .meter i { display: block; height: 100%; border-radius: 3px; background: var(--muted); }
  .meter.Alta i { background: var(--lime); } .meter.Média i { background: var(--amber); }

  .scrim { position: fixed; inset: 0; background: rgba(0, 0, 0, .55); opacity: 0; pointer-events: none; transition: opacity .25s; z-index: 40; }
  .sheet { position: fixed; z-index: 50; left: 50%; bottom: 0; width: min(760px, 100%); max-height: 92vh; overflow: auto; transform: translate(-50%, 102%);
           background: var(--surface); border: 1px solid var(--line); border-bottom: 0; border-radius: 24px 24px 0 0; padding: 10px 22px 40px; transition: transform .3s cubic-bezier(.2, .8, .2, 1); }
  body.open .scrim { opacity: 1; pointer-events: auto; }
  body.open .sheet { transform: translate(-50%, 0); }
  .grab { width: 40px; height: 4px; border-radius: 4px; background: var(--line); margin: 4px auto 14px; }
  .sheet h2 { font: 600 26px/1.15 var(--serif); margin: 4px 0 2px; }
  .sheet h3 { font: 600 19px var(--serif); margin: 22px 0 6px; }
  .sheet .sub { color: var(--muted); margin: 0 0 16px; }
  .close { position: absolute; right: 16px; top: 14px; background: var(--raised); border: 0; width: 34px; height: 34px; border-radius: 50%; font-size: 18px; }
  .vs { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 14px 0; }
  .vs .team { background: var(--raised); border-radius: var(--r-sm); padding: 12px; }
  .vs .team b { display: block; font-size: 15px; }
  .vs .team .pos { color: var(--muted); font-size: 13px; }
  .form { display: flex; gap: 3px; margin: 8px 0; }
  .form span { width: 20px; height: 20px; border-radius: 6px; font-size: 11px; font-weight: 700; display: grid; place-items: center; }
  .form .V { background: rgba(198, 244, 50, .16); color: var(--lime); }
  .form .E { background: var(--line); color: var(--muted); }
  .form .D { background: rgba(232, 111, 94, .16); color: var(--red); }
  .stat { display: flex; justify-content: space-between; font-size: 13px; color: var(--muted); padding: 3px 0; }
  .stat b { color: var(--ink); font-weight: 600; }
  .reads { margin: 6px 0 4px; padding: 0; list-style: none; }
  .reads li { padding: 10px 0; border-bottom: 1px solid var(--line-soft); font-size: 14.5px; color: #DCE3DA; }

  /* mercados: barra de acerto em cada seleção */
  .mkt { border: 1px solid var(--line-soft); border-radius: var(--r-sm); margin: 10px 0; overflow: hidden; }
  .mkt-h { display: flex; justify-content: space-between; padding: 10px 14px; background: var(--raised); font-weight: 600; font-size: 14px; }
  .mkt-h span { color: var(--muted); font-weight: 400; font-size: 12px; }
  .opt { display: grid; grid-template-columns: 1fr auto; gap: 6px 12px; padding: 12px 14px; border-top: 1px solid var(--line-soft); align-items: center; }
  .opt.top { background: rgba(198, 244, 50, .05); }
  .opt .name { font-weight: 600; font-size: 14px; }
  .opt .pc { font: 600 18px var(--serif); text-align: right; }
  .opt .track { grid-column: 1 / -1; height: 6px; border-radius: 3px; background: var(--line-soft); overflow: hidden; }
  .opt .track i { display: block; height: 100%; border-radius: 3px; background: var(--muted); }
  .opt .track.Alta i { background: var(--lime); } .opt .track.Média i { background: var(--amber); }
  .opt .meta { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: center; font-size: 12px; color: var(--muted); }
  .opt .meta b { color: var(--ink); font-weight: 600; }
  details { border-top: 1px solid var(--line-soft); padding: 12px 0; margin-top: 12px; }
  summary { cursor: pointer; color: var(--muted); font-weight: 500; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; font-variant-numeric: tabular-nums; margin-top: 8px; }
  th, td { padding: 7px 4px; text-align: right; border-bottom: 1px solid var(--line-soft); }
  th:first-child, td:first-child { text-align: left; color: var(--muted); }
  th { color: var(--faint); font-weight: 500; }

  .field { margin: 12px 0; }
  .field label { display: block; color: var(--muted); font-size: 13px; margin-bottom: 6px; }
  .field input { width: 100%; background: var(--raised); border: 1px solid var(--line); border-radius: var(--r-sm); padding: 12px 14px; font-size: 17px; }
  .field input:focus { outline: 2px solid var(--lime); outline-offset: 1px; }
  .seg { display: flex; flex-wrap: wrap; background: var(--raised); border-radius: 999px; padding: 4px; gap: 4px; }
  .seg button { flex: 1; border: 0; background: none; color: var(--muted); padding: 8px 10px; border-radius: 999px; font-weight: 600; }
  .seg button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
  .preview { background: var(--raised); border-radius: var(--r-sm); padding: 12px 14px; margin: 14px 0; font-size: 14px; }
  .preview b { color: var(--lime); }
  .warn { color: var(--amber); margin-top: 6px; }

  .kpis { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin: 16px 0; }
  .kpi { background: var(--surface); border: 1px solid var(--line-soft); border-radius: var(--r-sm); padding: 14px; }
  .kpi span { color: var(--muted); font-size: 12px; }
  .kpi b { display: block; font: 600 24px/1.2 var(--serif); margin: 2px 0; }
  .kpi small { color: var(--faint); font-size: 12px; }
  .pos { color: var(--lime); } .neg { color: var(--red); }
  .chart { background: var(--surface); border: 1px solid var(--line-soft); border-radius: var(--r); padding: 16px; margin: 12px 0; position: relative; }
  .chart h3 { font: 600 17px var(--serif); margin: 0 0 2px; }
  .chart p { color: var(--muted); font-size: 13px; margin: 0 0 10px; }
  .chart svg { width: 100%; height: auto; display: block; touch-action: none; }
  .legend { display: flex; gap: 14px; font-size: 12px; color: var(--muted); margin-top: 6px; }
  .legend i { display: inline-block; width: 16px; height: 0; border-top: 2.5px solid var(--lime); margin-right: 6px; vertical-align: middle; }
  .legend i.ref { border-top: 2px dashed var(--muted); }
  .tooltip { position: absolute; pointer-events: none; background: var(--ink); color: var(--bg); border-radius: 10px; padding: 8px 10px; font-size: 12px; white-space: nowrap; display: none; z-index: 2; }
  .tooltip b { font-size: 14px; }
  .forecast { background: linear-gradient(135deg, rgba(198, 244, 50, .10), rgba(47, 143, 91, .08)); border: 1px solid rgba(198, 244, 50, .25); border-radius: var(--r); padding: 18px; margin: 12px 0; }
  .forecast b { font: 600 26px var(--serif); color: var(--lime); }
  .betrow { display: grid; grid-template-columns: 1fr auto; gap: 10px; padding: 14px 0; border-bottom: 1px solid var(--line-soft); }
  .betrow .w { color: var(--muted); font-size: 13px; }
  .betrow .r { text-align: right; }
  .res { font-size: 12px; font-weight: 600; border-radius: 999px; padding: 3px 9px; }
  .res.ganha, .res.meio-ganha { background: var(--lime-soft); color: var(--lime); }
  .res.perdida, .res.meio-perdida { background: rgba(232, 111, 94, .14); color: var(--red); }
  .res.pendente, .res.anulada { background: var(--raised); color: var(--muted); }
  .mini { background: none; border: 0; color: var(--faint); font-size: 12px; text-decoration: underline; padding: 2px 4px; }
  .bankset { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 14px; }
  .bankset input { width: 90px; background: var(--raised); border: 1px solid var(--line); border-radius: 10px; padding: 6px 10px; text-align: right; }
  footer { color: var(--faint); font-size: 12px; padding: 30px 0 110px; }
  .toast { position: fixed; left: 50%; bottom: 90px; transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 999px; font-weight: 600; display: none; z-index: 60; }

  @media (max-width: 640px) {
    .tabs { display: none; }
    nav.bottom { display: flex; position: fixed; z-index: 30; left: 0; right: 0; bottom: 0; background: rgba(13, 31, 23, .94); backdrop-filter: blur(14px);
                 border-top: 1px solid var(--line); padding: 8px 10px calc(8px + env(safe-area-inset-bottom)); }
    nav.bottom button { flex: 1; min-width: 0; background: none; border: 0; color: var(--faint); font-size: 8.5px; font-weight: 600; display: grid; justify-items: center; gap: 3px; padding: 4px 0; white-space: nowrap; overflow: hidden; letter-spacing: -.03em; }
    nav.bottom button svg { width: 22px; height: 22px; }
    nav.bottom button[aria-current="page"] { color: var(--lime); }
    h1 { font-size: 29px; }
    .tip { padding: 18px; }
    .tip .match { font-size: 20px; }
    .wrap { padding: 0 16px; }
    .sheet { padding: 10px 16px 40px; }
  }

  /* ===== camada futurista: aurora, vidro, movimento ===== */
  :root { --tech: "Space Grotesk", var(--sans); --glass: rgba(13, 31, 23, .62); --glass-line: rgba(198, 244, 50, .14); --ease: cubic-bezier(.2, .8, .2, 1); }
  body { background: #040D09; }
  body::before { content: ""; position: fixed; inset: -20%; z-index: -2; pointer-events: none;
    background: radial-gradient(40% 35% at 20% 15%, rgba(198, 244, 50, .10), transparent 70%),
                radial-gradient(35% 40% at 85% 25%, rgba(47, 143, 91, .22), transparent 70%),
                radial-gradient(45% 45% at 60% 90%, rgba(46, 120, 160, .12), transparent 70%);
    animation: aurora 26s ease-in-out infinite alternate; }
  body::after { content: ""; position: fixed; inset: 0; z-index: -1; pointer-events: none; opacity: .05; mix-blend-mode: overlay;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>"); }
  @keyframes aurora { 0% { transform: translate3d(0, 0, 0) rotate(0deg); } 50% { transform: translate3d(4%, -3%, 0) rotate(8deg); } 100% { transform: translate3d(-4%, 3%, 0) rotate(-6deg); } }
  header { background: rgba(4, 13, 9, .55); border-bottom-color: var(--glass-line); }
  .tip, .slip, .kpi, .chart, .mkt, .daybar, .forecast, .vs .team {
    background: linear-gradient(160deg, rgba(20, 44, 33, .72), rgba(8, 20, 15, .66)); backdrop-filter: blur(18px) saturate(140%);
    -webkit-backdrop-filter: blur(18px) saturate(140%); border: 1px solid var(--glass-line); box-shadow: 0 10px 40px -18px rgba(0, 0, 0, .7), inset 0 1px 0 rgba(255, 255, 255, .04); }
  .daybar { gap: 0; } .daybar div { background: transparent; border-right: 1px solid var(--glass-line); } .daybar div:last-child { border-right: 0; }
  .tip { position: relative; overflow: hidden; transition: transform .35s var(--ease), box-shadow .35s var(--ease), border-color .35s; }

<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const fmt = (n, d = 2) => Number(n).toLocaleString('pt-PT', { minimumFractionDigits: d, maximumFractionDigits: d });
const eur = n => (n < 0 ? '−' : '') + fmt(Math.abs(n)) + ' €';
const signed = n => (n > 0.004 ? '+' : n < -0.004 ? '−' : '') + fmt(Math.abs(n)) + ' €';
const pc = p => Math.round(p * 100) + '%';
const oddf = n => Number(n).toLocaleString('pt-PT', { minimumFractionDigits: 2, maximumFractionDigits: 3 });  // como a casa: 1,248
const hm = iso => new Date(iso).toLocaleTimeString('pt-PT', { hour: '2-digit', minute: '2-digit' });
const store = { get: (k, d) => { try { return localStorage.getItem(k) ?? d; } catch { return d; } }, set: (k, v) => { try { localStorage.setItem(k, v); } catch {} } };
const STAKE = { Alta: 0.02, 'Média': 0.01, Baixa: 0.005 };  // fração da banca sugerida por nível de confiança
let data = null, bets = null, league = 'Todas', period = store.get('period', 'semana');
const bank = () => parseFloat(store.get('bank', '100')) || 100;
const espSels = g => (g.especialista || []).map(o => ({ sel: 'esp:' + o.key, label: o.label, market: o.family, short: o.family, p_est: o.p, conf: o.conf,
  min_odd_est: o.min_odd, best_odd: null, hist: o.hist, texto: o.texto, titulo: o.titulo, risco: o.risco, name: o.name }));
const allSels = g => espSels(g).concat(g.markets.flatMap(m => m.selections.map(s => ({ ...s, line: m.line }))));
const pickOf = id => data.selecao.apostas.find(p => p.game_id === id);
const confDots = c => `<span class="conf ${c}">${[0, 1, 2].map(i => `<i class="${i < { Alta: 3, 'Média': 2, Baixa: 1 }[c] ? 'on' : ''}"></i>`).join('')} ${c === 'Média' ? 'Média' : c}</span>`;

/* navegação */
function show(view) {
  for (const v of ['hoje', 'aovivo', 'raspadinhas', 'jogos', 'calendario', 'boletins', 'desempenho', 'definicoes']) $('#' + v).hidden = v !== view;
  document.querySelectorAll('[data-view]').forEach(b => b.dataset.view === view ? b.setAttribute('aria-current', 'page') : b.removeAttribute('aria-current'));
  store.set('view', view); window.scrollTo(0, 0);
  const sec = $('#' + view); sec.classList.remove('enter'); void sec.offsetWidth; sec.classList.add('enter');
  if (view === 'desempenho' || view === 'boletins') loadBets();
  if (view === 'definicoes') renderDefinicoes();
}
document.querySelectorAll('[data-view]').forEach(b => b.addEventListener('click', () => show(b.dataset.view)));
$('#home').addEventListener('click', () => show('hoje'));
document.addEventListener('click', e => { const l = e.target.closest('[data-view-link]'); if (l) show(l.dataset.viewLink); });
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.style.display = 'block'; setTimeout(() => t.style.display = 'none', 2200); }
function openSheet(html) { $('#sheetBody').innerHTML = html; $('#sheet').scrollTop = 0; document.body.classList.add('open'); motion($('#sheetBody')); }
function closeSheet() { document.body.classList.remove('open'); }

// Na Cloudflare a app pede a palavra-passe uma vez por aparelho (fica guardada neste browser); no PC é ignorada.
let askKey = null;
async function apiFetch(path, body, retry = true) {
  const headers = { 'x-bigodds-chave': store.get('chave', '') };
  if (body) headers['Content-Type'] = 'application/json';
  const r = await fetch(path, body ? { method: 'POST', headers, body: JSON.stringify(body) } : { headers });
  if (r.status === 401 && retry) {
    const why = (await r.clone().json().catch(() => ({}))).error || '';
    askKey ||= Promise.resolve(prompt((store.get('chave', '') ? why + '\n\n' : '') + 'Palavra-passe da tua conta Bigodds (só a palavra-passe, sem o nome):'));
    const k = await askKey; setTimeout(() => { askKey = null; }, 1000);
    if (k) { store.set('chave', k.trim()); return apiFetch(path, body, false); }
  }
  return r;
}
async function api(path, body) {
  const r = await apiFetch(path, body);
  const j = await r.json(); if (!r.ok) throw new Error(j.error || r.statusText); return j;
}

function ring(p) {
  const r = 38, c = 2 * Math.PI * r;
  return `<div class="ring" role="img" aria-label="${pc(p)} de acerto estimado"><svg viewBox="0 0 92 92" width="92" height="92">
    <circle cx="46" cy="46" r="${r}" fill="none" stroke="var(--line)" stroke-width="7"/>
    <circle class="arc" cx="46" cy="46" r="${r}" fill="none" stroke="var(--lime)" stroke-width="7" stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${c * (1 - p)}" style="--c:${c}"/></svg>
    <div class="val"><div><b>${pc(p)}</b><span>ACERTO</span></div></div></div>`;
}
const RING_COLORS = ['#D8FF5A', '#9BE15D', '#5FCB8A', '#3FA3A0'];
function dayRings(tips) {
  const avg = tips.reduce((s, t) => s + t.p.p, 0) / tips.length;
  const rings = tips.slice(0, 4).map((t, i) => { const r = 90 - i * 12, c = 2 * Math.PI * r;
    return `<circle cx="100" cy="100" r="${r}" fill="none" stroke="rgba(255,255,255,.06)" stroke-width="8"/>
      <circle class="arc" cx="100" cy="100" r="${r}" fill="none" stroke="${RING_COLORS[i]}" stroke-width="8" stroke-linecap="round"
        stroke-dasharray="${c}" stroke-dashoffset="${c * (1 - t.p.p)}" style="--c:${c};animation-delay:${.15 + i * .18}s"><title>${esc(t.p.label)}: ${pc(t.p.p)}</title></circle>`; }).join('');
  return `<div class="orb-wrap"><div class="orb" role="img" aria-label="Acerto médio estimado das apostas do dia: ${pc(avg)}"><div class="glow"></div>
      <svg viewBox="0 0 200 200">${rings}</svg><div class="orb-mid"><div><b data-count="${Math.round(avg * 100)}">${pc(avg)}</b><span>ACERTO MÉDIO</span></div></div></div>
    <div class="orb-key">${tips.slice(0, 4).map((t, i) => `<span><i style="background:${RING_COLORS[i]}"></i>${esc(t.p.label)} · ${pc(t.p.p)}</span>`).join('')}</div></div>`;
}
function countdown(iso) {
  const m = Math.max(0, Math.round((new Date(iso) - Date.now()) / 60000));
  return m < 1 ? 'A começar agora' : `Próximo jogo em ${m >= 60 ? Math.floor(m / 60) + 'h ' : ''}${m % 60}min`;
}
setInterval(() => document.querySelectorAll('.chip-live[data-kickoff]').forEach(c => c.querySelector('.cd').textContent = countdown(c.dataset.kickoff)), 30000);

/* movimento: entradas em cascata, números a contar, brilho que segue o dedo/rato */
function motion(root) {
  root.querySelectorAll('.tip, .slip, .kpi, .chart, .mkt, .row, .daybar, .forecast, .ticket, .orb-wrap').forEach((el, i) => {
    el.classList.add('reveal'); el.style.setProperty('--d', Math.min(i, 8) * 0.06 + 's');
  });
  root.querySelectorAll('[data-count]').forEach(el => {
    const to = +el.dataset.count, t0 = performance.now();
    const step = t => { const k = Math.min(1, (t - t0) / 1100), e = 1 - Math.pow(1 - k, 3); el.textContent = Math.round(to * e) + '%'; if (k < 1) requestAnimationFrame(step); };
    requestAnimationFrame(step);
  });
}

const DAY_LIMIT = 0.05, STOP_LOSSES = 2, WEEK_LOSS = 0.15;  // 5% da banca por dia; pausa depois de 2 perdidas no dia ou de perder 15% da banca em 7 dias
let allBets = [], me = '';  // me: nome da conta (só na Cloudflare)
let todayBets = [];
function disciplina() {
  const used = todayBets.reduce((s, b) => s + b.stake, 0), limit = bank() * DAY_LIMIT;
  const lost = todayBets.filter(b => b.result === 'perdida').length;
  const week = allBets.filter(b => b.result !== 'pendente' && Date.now() - new Date(b.kickoff) <= 7 * 864e5).reduce((s, b) => s + (b.profit || 0), 0);
  if (-week >= bank() * WEEK_LOSS) return `<div class="note" style="border-left-color:var(--red)"><b style="color:var(--red)">Pausa esta semana.</b> Perdeste ${eur(-week)} nos últimos 7 dias, mais de 15% da banca. Os modelos não mudaram; o risco de apostar para recuperar é que mudou. Volta quando o saldo da semana descer abaixo do limite.</div>`;
  // perseguir perdas: depois de uma aposta perdida, a seguinte com stake 50% maior em menos de 24 h
  const byTime = [...allBets].sort((a, b) => (a.created || '').localeCompare(b.created || ''));
  const chase = byTime.some((b, i) => i && byTime[i - 1].result === 'perdida' && b.stake >= 1.5 * byTime[i - 1].stake
    && new Date(b.created) - new Date(byTime[i - 1].kickoff) < 864e5 && Date.now() - new Date(b.created) < 3 * 864e5);
  const chaseNote = chase ? `<div class="note" style="border-left-color:var(--amber)"><b style="color:var(--amber)">Atenção:</b> subiste o valor logo a seguir a uma aposta perdida. É o padrão de "perseguir perdas". Mantém o valor sugerido.</div>` : '';
  if (lost >= STOP_LOSSES) return `<div class="note" style="border-left-color:var(--red)"><b style="color:var(--red)">Pausa por hoje.</b> Já perdeste ${lost} apostas hoje. A regra é parar: os dias maus acontecem e perseguir perdas é o erro mais caro.</div>`;
  const pctUsed = Math.min(1, used / limit);
  return `<div class="kpi" style="margin:4px 0 8px"><span>Limite de hoje (5% da banca)</span>
    <b>${eur(Math.max(0, limit - used))} <small style="font-size:13px;color:var(--muted)">disponível de ${eur(limit)}</small></b>
    <div class="track" style="height:6px;border-radius:3px;background:var(--line-soft);overflow:hidden;margin-top:6px"><i style="display:block;height:100%;width:${pctUsed * 100}%;background:${pctUsed >= 1 ? 'var(--red)' : 'var(--lime)'}"></i></div>
    <small>${used ? `Já apostaste ${eur(used)} hoje.` : 'Ainda não apostaste hoje.'} Regras: para depois de ${STOP_LOSSES} apostas perdidas no mesmo dia, ou quando perderes 15% da banca numa semana.</small></div>${chaseNote}`;
}

/* gráfico: lucro acumulado real (lima) contra o esperado pelas probabilidades (linha de referência tracejada) */
let chartPts = [];
const CH = { W: 640, H: 220, L: 52, R: 16, T: 16, B: 24 };
function chart(done) {
  if (done.length < 2) return `<div class="chart"><h3>Real contra esperado</h3><p>O gráfico aparece a partir de 2 apostas fechadas.</p></div>`;
  const sorted = [...done].sort((a, b) => a.kickoff.localeCompare(b.kickoff));
  let r = 0, e = 0;
  chartPts = sorted.map((b, i) => ({ i, real: r += b.profit, exp: e += b.ev, b }));
  const { W, H, L, R, T, B } = CH, vals = chartPts.flatMap(p => [p.real, p.exp]).concat(0);
  const lo = Math.min(...vals), hi = Math.max(...vals), span = hi - lo || 1;
  const x = i => L + (W - L - R) * i / (chartPts.length - 1), y = v => T + (H - T - B) * (1 - (v - lo) / span);
  const path = k => chartPts.map((p, i) => `${i ? 'L' : 'M'}${x(i).toFixed(1)},${y(p[k]).toFixed(1)}`).join('');
  const last = chartPts.at(-1), gap = Math.abs(y(last.real) - y(last.exp)) < 18;
  return `<div class="chart" id="chart"><h3>Real contra esperado</h3><p>Lucro acumulado aposta a aposta. A linha tracejada é o que as probabilidades previam.</p>
    <svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Lucro acumulado real ${signed(last.real)} contra esperado ${signed(last.exp)}">
      <line x1="${L}" x2="${W - R}" y1="${y(0)}" y2="${y(0)}" stroke="var(--line)"/>
      <text x="${L - 8}" y="${y(0) + 4}" text-anchor="end" font-size="11" fill="var(--faint)">0 €</text>
      <path d="${path('exp')}" fill="none" stroke="var(--muted)" stroke-width="2" stroke-dasharray="5 5"/>
      <path d="${path('real')}" fill="none" stroke="var(--lime)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
      <circle cx="${x(last.i)}" cy="${y(last.real)}" r="4.5" fill="var(--lime)"/>
      <text x="${x(last.i) - 8}" y="${y(last.real) - 10}" text-anchor="end" font-size="12" font-weight="600" fill="var(--ink)">${signed(last.real)}</text>
      ${gap ? '' : `<text x="${x(last.i) - 8}" y="${y(last.exp) + 16}" text-anchor="end" font-size="11" fill="var(--muted)">esperado ${signed(last.exp)}</text>`}
      <line id="cross" y1="${T}" y2="${H - B}" stroke="var(--muted)" stroke-width="1" visibility="hidden"/>
      <rect id="hit" x="${L - 10}" y="0" width="${W - L - R + 20}" height="${H}" fill="transparent"/>
    </svg><div class="legend"><span><i></i>Real</span><span><i class="ref"></i>Esperado</span></div>
    <div class="tooltip" id="tt"></div></div>`;
}
function wireChart() {
  const svg = document.querySelector('#chart svg'); if (!svg || chartPts.length < 2) return;
  const hit = svg.querySelector('#hit'), cross = svg.querySelector('#cross'), tt = $('#tt'), { W, L, R } = CH;
  const move = ev => {
    const box = svg.getBoundingClientRect(), sx = (ev.clientX - box.left) / box.width * W, n = chartPts.length;
    const i = Math.max(0, Math.min(n - 1, Math.round((sx - L) / (W - L - R) * (n - 1)))), p = chartPts[i], px = L + (W - L - R) * i / (n - 1);
    cross.setAttribute('x1', px); cross.setAttribute('x2', px); cross.setAttribute('visibility', 'visible');
    tt.replaceChildren(); const v = document.createElement('b'); v.textContent = signed(p.real);
    tt.append(v, ` real · ${signed(p.exp)} esperado`, document.createElement('br'), `${p.b.label} · ${p.b.home} – ${p.b.away}`);
    tt.style.display = 'block'; tt.style.top = '64px';
    tt.style.left = Math.min(Math.max(px / W * box.width + 16 - tt.offsetWidth / 2, 8), box.width - tt.offsetWidth) + 'px';
  };
  hit.addEventListener('pointermove', move); hit.addEventListener('pointerdown', move);
  hit.addEventListener('pointerleave', () => { cross.setAttribute('visibility', 'hidden'); tt.style.display = 'none'; });
}

  }
  if ((m = t.match(/dupla hip\w*\D*(1x|x2)/))) {

    return { sel: 'esp:dc', label: `${team} ou empate`, market: 'Resultado' };
  }
  if ((m = t.match(/total\s*individual\s*(1|2)?\D*(acima|mais)\D*\(?0[.,]5/))) {
    return m[1] === '2' ? { sel: 'esp:as', label: `${g.away} marca`, market: 'Equipa marca' } : { sel: 'esp:hs', label: `${g.home} marca`, market: 'Equipa marca' };

    if (/cart/.test(t) && half1) return line < 10 ? { sel: `esp:y1${up ? '+' : '-'}${line}`, label: `${up ? 'Mais' : 'Menos'} de ${lt} amarelos na 1.ª parte`, market: 'Cartões 1.ª parte', line } : null;
    if (/canto|escante/.test(t) && half1) return null;  // cantos por parte: ainda não acompanho
    if (/cart/.test(t)) return { sel: `esp:y${up ? '+' : '-'}${line}`, label: `${up ? 'Mais' : 'Menos'} de ${lt} amarelos`, market: 'Cartões', line };
    if (/canto|escante/.test(t)) return { sel: `esp:c${up ? '+' : '-'}${line}`, label: `${up ? 'Mais' : 'Menos'} de ${lt} cantos`, market: 'Cantos', line };
    if (/(^|\D)1\s*[.,]?\s*[ºªo°a]?\s*parte|primeira parte/.test(t)) return up && line === 0.5 ? { sel: 'esp:ht+0.5', label: 'Há golo na 1.ª parte', market: 'Golos por parte' } : null;
    if (/(^|\D)2\s*[.,]?\s*[ºªo°a]?\s*parte|segunda parte/.test(t)) return up && line === 0.5 ? { sel: 'esp:g2+0.5', label: 'Há golo na 2.ª parte', market: 'Golos por parte' } : null;
    if (line === 2.5) return { sel: up ? 'ou:+2,5' : 'ou:-2,5', label: `${up ? 'Mais' : 'Menos'} de 2,5 golos`, market: 'Golos 2,5' };

function parseSlipText(text) {
  const lines = text.split('\n').map(x => x.trim()).filter(Boolean);
  const dateRe = /(\d{2})[.\/-](\d{2})[.\/-](\d{4})\s*\(?(\d{1,2}):(\d{2})/;
  const oddRe = /^(.*?)\s+(\d{1,3}[.,]\d{1,3})\s*$/;
  const legs = [], falhas = [];
  for (let i = 0; i < lines.length; i++) {
    const d = lines[i].match(dateRe); if (!d) continue;
    const date = `${d[1]}/${d[2]}/${d[3]}`;
    let j = i + 1, mkt = null;
    for (; j < Math.min(lines.length, i + 8); j++) { const o = lines[j].match(oddRe); if (o && /1x2|total|dupla|ambas|handicap|canto|cart|individual/i.test(deaccent(o[1]))) { mkt = o; break; } }
    if (!mkt) continue;
    const block = compact(lines.slice(i + 1, j).join(' '));
    const cands = (data.todos || []).filter(g => g.date === date);
    const best = cands.map(g => ({ g, s: teamHit(g.home, block) + teamHit(g.away, block) })).sort((a, b) => b.s - a.s)[0];
    if (!best || best.s === 0) { falhas.push(`Não encontrei o jogo de ${date}: "${lines.slice(i + 1, j).join(' ').slice(0, 60)}"`); continue; }
    const m = parseMarket(mkt[1], best.g);
    if (!m) { falhas.push(`${best.g.home} – ${best.g.away}: mercado "${mkt[1]}" ainda não é dos meus mercados`); continue; }
    const live = data.games.find(x => x.id === best.g.id);
    // o número testado e calibrado do especialista tem prioridade sobre a estimativa genérica do mesmo resultado
    const espSame = live && (live.especialista || []).find(o => o.label === m.label);
    const s = espSame ? { p_est: espSame.p, min_odd_est: espSame.min_odd } : live ? allSels(live).find(x => x.sel === m.sel) : null;
    legs.push({ game_id: best.g.id, sel: m.sel, label: m.label, market: m.market, line: m.line ?? '', p: s ? s.p_est : null,
                min_odd: s ? s.min_odd_est : null, home: best.g.home, away: best.g.away, kickoff: best.g.kickoff, div: best.g.div,
                date: best.g.date, odd: mkt[2].replace(',', '.') });
    i = j;
  }
  return { legs, falhas, book: /betclic/i.test(text) ? 'Betclic' : '22bet' };
}

// fotos de telemóvel têm 12+ megapíxeis: o leitor fica sem memória. Reduz para 1600 px de largura, em cinzento.
async function shrink(file) {
  const img = await createImageBitmap(file), k = Math.min(1, 1600 / img.width);
  const c = document.createElement('canvas'); c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
  const x = c.getContext('2d'); x.filter = 'grayscale(1) contrast(1.2)'; x.drawImage(img, 0, 0, c.width, c.height);
  return c;
}
async function importPhotos(files) {
  if (!files.length) return;
  toast('A ler a foto…');
  try {
    if (!window.Tesseract) await new Promise((ok, ko) => { const s = document.createElement('script');
      s.src = 'https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js'; s.onload = ok; s.onerror = () => ko(new Error('sem ligação para o leitor de texto')); document.head.appendChild(s); });
    const w = await Tesseract.createWorker('por');
    let text = '';
    for (const f of files) text += (await w.recognize(await shrink(f))).data.text + '\n';
    await w.terminate();
    const r = parseSlipText(text);
    if (!r.legs.length) return toast(r.falhas[0] || 'Não consegui ler apostas nesta foto');
    slip = r.legs; importNote = r; saveSlip(); slipSheet();
  } catch (e) { toast('Não consegui ler a foto' + (e && e.message ? ': ' + e.message : '. Tenta uma captura de ecrã do boletim em vez de uma fotografia.')); }
}

function remind(list) {

/* placar ao minuto direto da ESPN (deixa o browser ler): na Cloudflare o resto do estado ao vivo chega de 5 em 5 min */
const ESPN_SLUG = { E0: 'eng.1', SP1: 'esp.1', I1: 'ita.1', D1: 'ger.1', F1: 'fra.1', P1: 'por.1' };
function espnState(e) {
  const c = e.competitions[0], side = Object.fromEntries(c.competitors.map(t => [t.homeAway, t])), st = e.status;
  const stat = (t, n) => ((t.statistics || []).find(x => x.name === n) || {}).displayValue ?? null;
  const ev = [];
  for (const d of c.details || []) {
    const lado = (d.team || {}).id === side.home.team.id ? 'home' : 'away';
    const tipo = d.scoringPlay ? 'golo' : d.redCard ? 'vermelho' : d.yellowCard ? 'amarelo' : null;
    if (tipo && !d.shootout) ev.push({ tipo, lado, min: (d.clock || {}).displayValue || '', og: !!d.ownGoal, pen: !!d.penaltyKick, quem: ((d.athletesInvolved || [])[0] || {}).shortName || '' });
  }
  const hg = +side.home.score || 0, ag = +side.away.score || 0, cnt = x => ev.filter(e => e.tipo === 'golo' && e.lado === x).length;
  if (ev.some(e => e.og) && (cnt('home') !== hg || cnt('away') !== ag)) ev.forEach(e => { if (e.og) e.lado = e.lado === 'home' ? 'away' : 'home'; });
  const n = (t, k) => ev.filter(e => e.tipo === k && e.lado === t).length;
  return { estado: st.type.state, fase: st.type.name, detalhe: st.type.shortDetail, minuto: st.displayClock, parte: st.period, hg, ag,
    cantos: ['home', 'away'].map(x => stat(side[x], 'wonCorners')), remates: ['home', 'away'].map(x => stat(side[x], 'shotsOnTarget')),
    posse: ['home', 'away'].map(x => stat(side[x], 'possessionPct')), vermelhos: [n('home', 'vermelho'), n('away', 'vermelho')],
    amarelos: [n('home', 'amarelo'), n('away', 'amarelo')], eventos: ev };
}
async function espnRefresh() {
  const lv = data.games.filter(g => g.live && g.live.espn && g.live.estado !== 'post');
  const day = new Date().toLocaleDateString('sv-SE').replaceAll('-', '');
  for (const div of new Set(lv.map(g => g.div))) {
    try {
      const j = await (await fetch(`https://site.api.espn.com/apis/site/v2/sports/soccer/${ESPN_SLUG[div]}/scoreboard?dates=${day}`)).json();
      for (const e of j.events || []) { const g = lv.find(x => x.live.espn === e.id); if (g) Object.assign(g.live, espnState(e)); }
    } catch (err) { /* a ESPN falhou: fica o estado da última análise */ }
  }
}
async function pollLive() {
